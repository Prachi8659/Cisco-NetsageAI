services:
  # ----------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: netsage-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. React / Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: netsage-ai-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
